server:
  port: 9030

spring:
  application:
    name: spring-cloud-alibaba-nacos-config
  config:
    import:
      # SCA 2025 starter requires this property; the `optional:` prefix means
      # the app starts even if Nacos is unreachable. The actual config value
      # is delivered via NacosRestConfigInitializer (REST API, bypasses gRPC bug).
      - optional:nacos:${spring.application.name}.properties?refresh=true
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: properties
        group: DEFAULT_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
  profiles:
    active: dev

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
