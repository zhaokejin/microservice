server.port=8080
#### 数据库连接池属性
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/mytest?useSSL=false&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=root
#指定updates是否自动提交
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# 初始大小和最小空闲连接数
spring.datasource.hikari.minimum-idle=5
# 验证查询
spring.datasource.hikari.connection-test-query=SELECT 1
# 可选：设置连接池名称
spring.datasource.hikari.pool-name=MyAppHikariCP
# 可选：验证超时时间，默认30秒
spring.datasource.hikari.validation-timeout=3000
# 空闲超时时间，默认10分钟 连接在池中最小生存的时间（单位是毫秒）
spring.datasource.hikari.idle-timeout=600000
# 连接的最大生命周期，默认30分钟
spring.datasource.hikari.max-lifetime=1800000
# 测试空闲连接
spring.datasource.hikari.test-while-idle=true
# 不在借用时测试连接
spring.datasource.hikari.test-on-borrow=false
# 配置一个连接在池中最小生存的时间，单位是毫秒
# 每隔多久进行一次检测（单位是毫秒） 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
spring.datasource.hikari.maintenance-interval-millis=18800

# mybatis对应的映射文件路径
mybatis.mapper-locations=classpath:mapper/*.xml
# mybatis对应的实体类
mybatis.type-aliases-package=cn.cicoding.model
#logging.config = classpath:logback.xml
logging.level.root=info
logging.level.cn.cicoding=debug
# 指定注册到eureka server上的服务名称
spring.application.name=spring-cloud-alibaba-provider
# 是否展示健康检查详情
management.endpoint.health.show-details=always
# 注册到public(保留空间)中
# https://github.com/alibaba/spring-cloud-alibaba/wiki/Nacos-discovery
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.ip=127.0.0.1
#spring.cloud.nacos.discovery.access-key=test9090
#spring.cloud.nacos.discovery.secret-key=2HujQv5fY0UjN6UXp4+Q91AhqyJFoVm9J5p/Tv3Uzq0=
spring.cloud.nacos.discovery.username=nacos
spring.cloud.nacos.discovery.password=nacos
# 开放所有监控端点
management.endpoints.web.exposure.include = *
##注册中心 nacos   根据命名空间来注册到nacos
#spring.cloud.nacos.discovery.namespace=test
#spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
#spring.cloud.nacos.discovery.ip=127.0.0.1
#spring.cloud.nacos.discovery.service=${spring.application.name}
## 开放所有监控端点
#management.endpoints.web.exposure.include=*
spring.cloud.nacos.discovery.enabled=true

seata.enabled=true
seata.application-id=spring-cloud-alibaba-provider
seata.tx-service-group=default_tx_group
seata.service.vgroup-mapping.default_tx_group=default
seata.config.type=nacos
seata.config.nacos.server-addr=127.0.0.1:8848
seata.config.nacos.namespace=public
seata.config.nacos.group=SEATA_GROUP
seata.config.nacos.username=nacos
seata.config.nacos.password=nacos
seata.config.nacos.context-path=
seata.config.nacos.data-id=seataServer.properties
seata.registry.type=nacos
seata.registry.nacos.application=seata-server
seata.registry.nacos.server-addr=127.0.0.1:8848
seata.registry.nacos.username=nacos
seata.registry.nacos.password=nacos
seata.registry.nacos.namespace=public
seata.registry.nacos.group=SEATA_GROUP
seata.registry.nacos.cluster=default
seata.client.transaction-service-group=default_tx_group
seata.client.rm.report-success-enable=false