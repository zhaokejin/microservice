services:
  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: nacos-standalone
    restart: unless-stopped
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - NACOS_AUTH_TOKEN_SECRET_KEY=SecretKey012345678901234567890123456789012345678901234567890123456789
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    ports:
      - "8848:8848"   # HTTP 控制台
      - "9848:9848"   # gRPC 客户端通信（SCA 2025 Nacos Client 3.x 需要）
      - "9849:9849"   # gRPC 服务端通信
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: mysql-standalone
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mytest
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Consul 注册配置中心 ====================
  consul:
    image: consul:1.15
    container_name: consul-standalone
    restart: unless-stopped
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"   # HTTP API
      - "8600:8600"   # DNS
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== SkyWalking 链路追踪 ====================
  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    container_name: skywalking-oap
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
      - SW_STORAGE=h2
      - SW_CORE_METER_ANALYSIS_ACTIVE_FILES=spring-sleuth,thread-pool
      - SW_TELEMETRY=none
    ports:
      - "11800:11800"   # gRPC：Java Agent 上报链路数据
      - "12800:12800"   # HTTP：SkyWalking UI 查询
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/11800"]
      interval: 10s
      timeout: 5s
      retries: 5

  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    container_name: skywalking-ui
    restart: unless-stopped
    depends_on:
      skywalking-oap:
        condition: service_healthy
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
    ports:
      - "8080:8080"    # Web 控制台

  # ==================== 微服务 ====================
  provider:
    build:
      context: .                                # 项目根目录
      dockerfile: spring-cloud-alibaba-provider/Dockerfile
    container_name: provider
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
      skywalking-oap:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      # 挂载 SkyWalking Agent（只读）
      - ./skywalking/agent:/opt/skywalking/agent:ro
    environment:
      # 覆盖 Nacos 地址（容器内用服务名通信）
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=
      # 覆盖 MySQL 地址
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/mytest?useSSL=false&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      # SkyWalking Agent 配置
      - SW_AGENT_NAME=spring-cloud-alibaba-provider
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - JAVA_TOOL_OPTIONS=-javaagent:/opt/skywalking/agent/skywalking-agent.jar

volumes:
  nacos-data:
  nacos-logs:
  mysql-data:
  consul-data:
