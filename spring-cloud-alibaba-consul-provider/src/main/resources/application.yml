server:
  port: 9040

spring:
  application:
    name: consul-config-client
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mytest?useSSL=false&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
    username: root
    password: root
    hikari:
      auto-commit: true
      maximum-pool-size: 100
      minimum-idle: 5
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: consul-config-client
      config:
        enabled: true
        format: yaml
        prefix: config
        profile-separator: ':'
        data-key: data

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.cicoding.model

logging:
  level:
    root: info
    cn.cicoding: debug

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
